
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Free Demo | Intl Virtual Academy</title>

    <link rel="stylesheet" href="booking.css">
</head>

<body>

    <!-- Header -->
    <header class="booking-header">

        <a href="index.html" class="logo">
            Intl Virtual
            <span>Academy</span>
        </a>

        <a href="index.html" class="back-link">
            Back to Home
        </a>

    </header>


    <!-- Booking Main Section -->
    <main class="booking-container">

        <div class="booking-intro">

            <span class="small-heading">
                FREE TRIAL CLASS
            </span>

            <h1>Book Your Free Demo</h1>

            <p>
                Discover the perfect learning experience
                for your child.
            </p>

        </div>


        <!-- Booking Form -->
        <form id="bookingForm">

            <!-- Parent Information -->
            <h2>Parent Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="parentName">Parent Name</label>

                    <input type="text"
                           id="parentName"
                           placeholder="Enter parent name"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           placeholder="Enter email address"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">WhatsApp Number</label>

                    <input type="tel"
                           id="phone"
                           placeholder="Enter phone number"
                           required>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>

                    <select id="country" required>
                        <option value="">Select Country</option>
                        <option>UAE</option>
                        <option>Pakistan</option>
                        <option>United Kingdom</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>


            <!-- Student Information -->
            <h2>Student Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="studentName">Student Name</label>

                    <input type="text"
                           id="studentName"
                           placeholder="Enter student name"
                           required>
                </div>

                <div class="form-group">
                    <label for="age">Student Age</label>

                    <input type="number"
                           id="age"
                           min="3"
                           max="18"
                           placeholder="Enter age"
                           required>
                </div>

                <div class="form-group">
                    <label for="subject">Choose Subject</label>

                    <select id="subject" required>
                        <option value="">Select Subject</option>
                        <option>Mathematics</option>
                        <option>Coding & Computer Science</option>
                        <option>English</option>
                        <option>Quran</option>
                        <option>Science</option>
                        <option>Courses & Workshops</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="classType">Class Type</label>

                    <select id="classType" required>
                        <option value="">Select Class Type</option>
                        <option>One-on-One</option>
                        <option>Group Class</option>
                    </select>
                </div>

            </div>


            <!-- Demo Schedule -->
            <h2>Choose Your Demo Schedule</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="demoDate">Preferred Date</label>

                    <input type="date"
                           id="demoDate"
                           required>
                </div>

                <div class="form-group">
                    <label for="demoTime">Preferred Time</label>

                    <select id="demoTime" required>
                        <option value="">Select Time</option>
                        <option>10:00 AM</option>
                        <option>12:00 PM</option>
                        <option>2:00 PM</option>
                        <option>4:00 PM</option>
                        <option>6:00 PM</option>
                        <option>8:00 PM</option>
                    </select>
                </div>

            </div>


            <!-- Additional Information -->
            <div class="form-group">

                <label for="message">
                    Additional Information
                </label>

                <textarea id="message"
                          rows="4"
                          placeholder="Tell us about your child's learning goals..."></textarea>

            </div>


            <!-- Submit Button -->
            <button type="submit" class="submit-btn">
                Confirm Demo Booking
            </button>

            <!-- Confirmation Message -->
            <p id="confirmation"></p>

        </form>

    </main>


    <!-- JavaScript -->
    <script src="booking.js"></script>

</body>
</html>
